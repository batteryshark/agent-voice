<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Voice</title>
<style>body{margin:0;background:var(--oc-background);color:var(--oc-text);font:13px system-ui}main{padding:16px;display:grid;gap:16px}h1{font-size:18px;margin:0}p{margin:0;line-height:1.5}#chat{color:var(--oc-muted-text)}#status{min-height:38px;padding:12px;border:1px solid var(--oc-border);border-radius:8px}#actions,#mutes{display:flex;gap:8px;flex-wrap:wrap}#audio,#voice{display:grid;gap:12px}#voice[hidden]{display:none}#voice button{justify-self:start}#notice{white-space:pre-wrap;color:var(--oc-error-text)}button{max-width:100%}</style><style>#status[data-warming="true"]::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;border:2px solid var(--oc-border);border-top-color:currentColor;border-radius:50%;animation:warming 1s linear infinite}@keyframes warming{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#status[data-warming="true"]::before{animation:none}}</style></head>

<body><main><h1>Voice</h1><p id="chat">Open a chat to start.</p><p id="status" role="status">Microphone off</p><div id="actions"></div><div id="mutes"></div><div id="audio"></div><div id="voice"></div><div id="check"></div><div id="background"></div><p id="notice" role="alert"></p><p>Talk, then pause to send your words. Talking stops the spoken reply and the agent's current work.</p><p id="device-tip">Bluetooth setup can add a delay. You can try your Mac's built-in microphone while keeping headphones selected for output.</p></main><script src="main.js"></script></body></html>
